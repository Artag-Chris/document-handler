# Actualizaciones sugeridas para tu docker-compose.yml

# En el servicio siged-document-handler, agregar las variables de entorno:

  siged-document-handler:
    restart: unless-stopped
    build:
      context: ./DOCUMENT_HANDLER_API
      dockerfile: ./dockerfile
    ports:
      - '6133:6133'
    environment:
      - PORT=6133
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      # - ELASTICSEARCH_USERNAME=elastic    # Si tienes autenticación habilitada
      # - ELASTICSEARCH_PASSWORD=changeme   # Si tienes autenticación habilitada
      - DATABASE_URL=your_database_url_here
      - JWT_SECRET=your_jwt_secret_here
    working_dir: "/home/node/app"
    volumes:
      - ./DOCUMENT_HANDLER_API:/home/node/app
    command: npm run dev
    depends_on:
      - elasticsearch  # Asegurar que Elasticsearch inicie primero
    networks:
      - sigedNetwork

# También es recomendable agregar healthcheck al contenedor de Elasticsearch:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=elasticsearch
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sigedNetwork