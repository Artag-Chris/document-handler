# Configuración requerida para NGINX que está sirviendo como proxy

# En tu archivo de configuración nginx (normalmente en /etc/nginx/sites-available/ o /etc/nginx/conf.d/)
# Agrega o modifica estas directivas:

server {
    listen 80;
    server_name demo-facilwhatsappapi.facilcreditos.co;

    # IMPORTANTES: Límites de tamaño de archivo
    client_max_body_size 1G;          # Tamaño máximo del body (archivos)
    client_body_buffer_size 128k;     # Buffer para archivos grandes
    client_body_timeout 60s;          # Timeout para recibir el body
    client_header_timeout 60s;        # Timeout para headers
    
    # Timeouts para archivos grandes
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer sizes para archivos grandes
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # Importante: No buffering para archivos grandes
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://localhost:6133;  # Tu aplicación Node.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Alternativamente, si usas nginx global, puedes agregar en nginx.conf:
# http {
#     client_max_body_size 1G;
#     ...
# }

# Después de hacer los cambios, reinicia nginx:
# sudo systemctl reload nginx
# o
# sudo nginx -s reload